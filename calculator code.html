<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Calculator</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f0f0f0;
            font-family: Arial, sans-serif;
        }

        .calculator {
            width: 320px;
            padding: 20px;
            background: #222;
            border-radius: 15px;
        }

        #display {
            width: 100%;
            height: 70px;
            margin-bottom: 15px;
            padding: 10px;
            font-size: 28px;
            text-align: right;
            border: none;
            border-radius: 8px;
            background: white;
            color: black;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        button {
            height: 60px;
            font-size: 22px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background: #444;
            color: white;
        }

        button:hover {
            opacity: 0.8;
        }

        .operator {
            background: #ff9500;
        }

        .clear {
            background: #d9534f;
        }

        .equal {
            background: #28a745;
        }

        .zero {
            grid-column: span 2;
        }
    </style>
</head>

<body>

    <div class="calculator">

        <input type="text" id="display" value="0" readonly>

        <div class="buttons">

            <button class="clear" data-action="clear">C</button>
            <button data-action="backspace">⌫</button>
            <button data-action="operator" data-value="%">%</button>
            <button class="operator" data-action="operator" data-value="/">÷</button>

            <button data-action="number" data-value="7">7</button>
            <button data-action="number" data-value="8">8</button>
            <button data-action="number" data-value="9">9</button>
            <button class="operator" data-action="operator" data-value="*">×</button>

            <button data-action="number" data-value="4">4</button>
            <button data-action="number" data-value="5">5</button>
            <button data-action="number" data-value="6">6</button>
            <button class="operator" data-action="operator" data-value="-">−</button>

            <button data-action="number" data-value="1">1</button>
            <button data-action="number" data-value="2">2</button>
            <button data-action="number" data-value="3">3</button>
            <button class="operator" data-action="operator" data-value="+">+</button>

            <button class="zero" data-action="number" data-value="0">0</button>
            <button data-action="decimal">.</button>
            <button class="equal" data-action="equals">=</button>

        </div>
    </div>

    <script>
        const display = document.getElementById("display");
        const buttons = document.querySelector(".buttons");

        let expression = "";
        let justCalculated = false;

        function updateDisplay() {
            display.value = expression || "0";
        }

        function isOperator(char) {
            return ["+", "-", "*", "/", "%"].includes(char);
        }

        function appendNumber(number) {
            if (justCalculated) {
                expression = "";
                justCalculated = false;
            }

            expression += number;
            updateDisplay();
        }

        function appendDecimal() {
            if (justCalculated) {
                expression = "";
                justCalculated = false;
            }

            const parts = expression.split(/[+\-*/%]/);
            const currentNumber = parts[parts.length - 1];

            if (!currentNumber.includes(".")) {
                if (currentNumber === "") {
                    expression += "0.";
                } else {
                    expression += ".";
                }
            }

            updateDisplay();
        }

        function appendOperator(operator) {
            if (expression === "") return;

            justCalculated = false;

            const lastChar = expression.slice(-1);

            if (isOperator(lastChar)) {
                expression = expression.slice(0, -1);
            }

            expression += operator;
            updateDisplay();
        }

        function clearDisplay() {
            expression = "";
            justCalculated = false;
            updateDisplay();
        }

        function backspace() {
            expression = expression.slice(0, -1);
            justCalculated = false;
            updateDisplay();
        }

        function tokenize(input) {
            const tokens = [];
            let number = "";

            for (let char of input) {
                if ((char >= "0" && char <= "9") || char === ".") {
                    number += char;
                } else if (isOperator(char)) {
                    if (number !== "") {
                        tokens.push(parseFloat(number));
                        number = "";
                    }

                    tokens.push(char);
                } else {
                    throw new Error("Invalid input");
                }
            }

            if (number !== "") {
                tokens.push(parseFloat(number));
            }

            return tokens;
        }

        function calculate() {
            if (expression === "") return;

            try {
                const tokens = tokenize(expression);

                if (typeof tokens[tokens.length - 1] === "string") {
                    throw new Error("Invalid expression");
                }

                let values = tokens.slice();
                let i = 0;

                // Multiplication, division and modulo
                while (i < values.length) {
                    if (
                        values[i] === "*" ||
                        values[i] === "/" ||
                        values[i] === "%"
                    ) {
                        const left = values[i - 1];
                        const right = values[i + 1];

                        let result;

                        if (values[i] === "*") {
                            result = left * right;
                        } else if (values[i] === "/") {
                            if (right === 0) {
                                throw new Error("Cannot divide by zero");
                            }

                            result = left / right;
                        } else {
                            if (right === 0) {
                                throw new Error("Cannot divide by zero");
                            }

                            result = left % right;
                        }

                        values.splice(i - 1, 3, result);
                        i = 0;
                    } else {
                        i++;
                    }
                }

                // Addition and subtraction
                let result = values[0];

                for (let j = 1; j < values.length; j += 2) {
                    const operator = values[j];
                    const number = values[j + 1];

                    if (operator === "+") {
                        result += number;
                    } else if (operator === "-") {
                        result -= number;
                    }
                }

                if (!Number.isFinite(result)) {
                    throw new Error("Invalid result");
                }

                expression = String(
                    Math.round((result + Number.EPSILON) * 100000000) / 100000000
                );

                justCalculated = true;
                updateDisplay();

            } catch (error) {
                display.value = error.message;
                expression = "";
                justCalculated = true;
            }
        }

        buttons.addEventListener("click", function (event) {
            const button = event.target;

            if (button.tagName !== "BUTTON") return;

            const action = button.dataset.action;
            const value = button.dataset.value;

            if (action === "number") {
                appendNumber(value);
            } else if (action === "decimal") {
                appendDecimal();
            } else if (action === "operator") {
                appendOperator(value);
            } else if (action === "clear") {
                clearDisplay();
            } else if (action === "backspace") {
                backspace();
            } else if (action === "equals") {
                calculate();
            }
        });
    </script>

</body>
</html>
